<!-- Purpose: esqueleto do Demo 3 — as pastas que existem no disco, por que é UM workflow com DUAS raias, os dois fluxos lado a lado e o que é página / o que é servidor. Padrão: docs/references/padrao-esqueleto-visual.md -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1060" width="1200" height="1060" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="sv" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#4a8f4a"/></marker>
  </defs>
  <rect width="1200" height="1060" fill="#fbf7f1"/>
  <text x="40" y="42" font-size="19" font-weight="700" fill="#3b2a20">Demo 3 — o esqueleto no disco, as duas raias e as telas</text>
  <text x="40" y="63" font-size="12.5" fill="#8a7a6d">✓ = já existe e foi provado · borda tracejada = ainda a construir · medido ao vivo · 2026-09-28</text>

  <!-- ========== A. PASTAS ========== -->
  <rect x="34" y="80" width="560" height="312" rx="12" fill="#faf3ec" stroke="#b0764f" stroke-width="1.5"/>
  <text x="50" y="102" font-size="13.5" font-weight="700" fill="#6b3f27">📂 A. O que foi criado no disco</text>
  <text x="54" y="128" font-size="12.5" font-weight="700" fill="#3b2a20">demo-3-aprovacao-humana/</text>

  <rect x="72" y="140" width="500" height="28" rx="6" fill="#eef7ee" stroke="#4a8f4a" stroke-width="1.5"/>
  <text x="84" y="159" font-size="12" fill="#2f6b2f">✓ docs/ — arquitetura, sprints, plano do app e roteiro do vídeo</text>

  <rect x="72" y="174" width="500" height="28" rx="6" fill="#eef7ee" stroke="#4a8f4a" stroke-width="1.5"/>
  <text x="84" y="193" font-size="12" fill="#2f6b2f">✓ db/ — a tabela dos pendentes, 19 colunas, aplicada no banco</text>

  <rect x="72" y="208" width="500" height="28" rx="6" fill="#eef7ee" stroke="#4a8f4a" stroke-width="1.5"/>
  <text x="84" y="227" font-size="12" fill="#2f6b2f">✓ tests/ — 26 provas offline + o dado real capturado (fixtures)</text>

  <rect x="72" y="242" width="500" height="28" rx="6" fill="#eef7ee" stroke="#4a8f4a" stroke-width="1.5"/>
  <text x="84" y="261" font-size="12" fill="#2f6b2f">✓ ui/ — o site que a pessoa abre (React + TanStack Start)</text>

  <rect x="72" y="276" width="500" height="28" rx="6" fill="#eef7ee" stroke="#4a8f4a" stroke-width="1.5"/>
  <text x="84" y="295" font-size="12" fill="#2f6b2f">✓ assets/diagrams/ — este desenho e o diagrama do fluxo</text>

  <rect x="72" y="310" width="500" height="28" rx="6" fill="#eef7ee" stroke="#4a8f4a" stroke-width="1.5"/>
  <text x="84" y="329" font-size="12" fill="#2f6b2f">✓ README.md — a porta de entrada de quem clonar o repositório</text>

  <rect x="72" y="344" width="500" height="28" rx="6" fill="#fff" stroke="#9bbf9b" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="84" y="363" font-size="12" fill="#3b2a20">workflows/ — o fluxo exportado, ainda não salvo aqui</text>

  <!-- ========== B. DECISÃO ESTRUTURAL ========== -->
  <rect x="616" y="80" width="550" height="312" rx="12" fill="#f3eef7" stroke="#7a5a9f" stroke-width="2"/>
  <text x="632" y="102" font-size="13.5" font-weight="700" fill="#5a3f7a">🔁 B. Por que UM workflow com DUAS raias</text>

  <text x="632" y="128" font-size="12" fill="#3b2a20">Cada raia tem o seu próprio começo: a principal acorda quando</text>
  <text x="632" y="146" font-size="12" fill="#3b2a20">chega uma mensagem; o vigia acorda <tspan font-weight="700">pelo relógio</tspan>. São execuções</text>
  <text x="632" y="164" font-size="12" fill="#3b2a20">independentes que nunca se tocam — só olham a mesma tabela.</text>
  <text x="632" y="182" font-size="12" fill="#3b2a20">Ficam no <tspan font-weight="700">mesmo canvas</tspan> porque contam a mesma história.</text>

  <rect x="632" y="198" width="512" height="80" rx="8" fill="#fff" stroke="#7a5a9f" stroke-width="1.8"/>
  <text x="646" y="220" font-size="12" font-weight="700" fill="#5a3f7a">E há um motivo mais forte que a arrumação:</text>
  <text x="646" y="240" font-size="12" fill="#3b2a20">se a execução congelada se perder (reinício do servidor, limpeza automática),</text>
  <text x="646" y="258" font-size="12" fill="#3b2a20">ela não avisa ninguém — está morta. Quem avisa tem de estar VIVO.</text>

  <rect x="632" y="292" width="512" height="80" rx="8" fill="#faf3ec" stroke="#b0764f" stroke-width="1.5"/>
  <text x="646" y="314" font-size="12" font-weight="700" fill="#6b3f27">Analogia: o vigia é o conferente do pátio</text>
  <text x="646" y="334" font-size="12" fill="#3b2a20">Ele não carrega caminhão. Passa de hora em hora e pergunta: “este aqui está</text>
  <text x="646" y="352" font-size="12" fill="#3b2a20">parado tempo demais?” — e avisa. É conferência, não é o processo.</text>

  <!-- ========== C. OS DOIS FLUXOS ========== -->
  <rect x="34" y="408" width="1132" height="244" rx="12" fill="#faf3ec" stroke="#b0764f" stroke-width="1.5"/>
  <text x="50" y="430" font-size="13.5" font-weight="700" fill="#6b3f27">⚙️ C. As duas raias, lado a lado</text>

  <rect x="52" y="444" width="540" height="190" rx="9" fill="#fff" stroke="#6b3f27" stroke-width="2"/>
  <text x="68" y="468" font-size="13" font-weight="700" fill="#3b2a20">R1 · Raia principal</text>
  <text x="68" y="488" font-size="11.5" fill="#8a7a6d">começa: chegou mensagem de cliente · 17 nós no canvas</text>
  <text x="68" y="510" font-size="12" fill="#3b2a20">Uma execução para CADA mensagem.</text>
  <text x="68" y="530" font-size="12" fill="#3b2a20">Classifica → redige → grava → <tspan font-weight="700" fill="#5a3f7a">congela</tspan> → (decisão) →</text>
  <text x="68" y="550" font-size="12" fill="#3b2a20">grava quem decidiu → envia → avisa no Telegram.</text>
  <text x="68" y="576" font-size="11.5" font-weight="700" fill="#6b3f27">A mensagem dele (planejada):</text>
  <text x="68" y="595" font-size="11.5" fill="#3b2a20">“Concluído — Ana aprovou a resposta ao cliente.”</text>
  <text x="68" y="618" font-size="11" fill="#8a7a6d">provado até “grava quem decidiu”; envio e aviso, ainda não</text>

  <rect x="616" y="444" width="550" height="190" rx="9" fill="#fff" stroke="#7a5a9f" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="632" y="468" font-size="13" font-weight="700" fill="#5a3f7a">R2 · Raia do vigia — a construir</text>
  <text x="632" y="488" font-size="11.5" fill="#8a7a6d">começa: o relógio · 4 nós</text>
  <text x="632" y="510" font-size="12" fill="#3b2a20">Uma execução a cada N minutos, sempre igual.</text>
  <text x="632" y="530" font-size="12" fill="#3b2a20">Pergunta ao banco: “tem pendente parado há mais</text>
  <text x="632" y="550" font-size="12" fill="#3b2a20">de X minutos?” → se tem, avisa. Só isso.</text>
  <text x="632" y="576" font-size="11.5" font-weight="700" fill="#5a3f7a">A mensagem dele (planejada):</text>
  <text x="632" y="595" font-size="11.5" fill="#3b2a20">“3 respostas esperando aprovação há mais de 30 min.”</text>
  <text x="632" y="618" font-size="11" fill="#8a7a6d">não conhece a raia principal — conhece só a tabela</text>

  <!-- ========== D. O QUE A PESSOA VÊ ========== -->
  <rect x="34" y="668" width="1132" height="246" rx="12" fill="#eef7ee" stroke="#4a8f4a" stroke-width="2"/>
  <text x="50" y="690" font-size="13.5" font-weight="700" fill="#2f6b2f">🖥️ D. “As telas” — 3 páginas que a pessoa VÊ + 1 servidor que ninguém vê</text>
  <text x="50" y="710" font-size="12" fill="#3b2a20">O visitante troca de papel: escreve como cliente, revisa como atendente e volta a ser cliente para ver a resposta.</text>

  <rect x="52" y="724" width="260" height="170" rx="9" fill="#fff" stroke="#4a8f4a" stroke-width="1.8"/>
  <text x="66" y="748" font-size="12.5" font-weight="700" fill="#3b2a20">Página 1 · Fale com a gente</text>
  <text x="66" y="766" font-size="11" fill="#8a7a6d">a pessoa VÊ — papel de cliente</text>
  <text x="66" y="790" font-size="11.5" fill="#3b2a20">Escreve a dúvida. Três</text>
  <text x="66" y="808" font-size="11.5" fill="#3b2a20">mensagens de exemplo em</text>
  <text x="66" y="826" font-size="11.5" fill="#3b2a20">botões preenchem o campo.</text>
  <text x="66" y="852" font-size="11" font-weight="700" fill="#2f6b2f">✓ funciona</text>
  <text x="66" y="870" font-size="11" fill="#8a7a6d">criou a linha 5 no banco</text>

  <rect x="330" y="724" width="260" height="170" rx="9" fill="#fff" stroke="#9bbf9b" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="344" y="748" font-size="12.5" font-weight="700" fill="#3b2a20">Página 2 · Mesa de triagem</text>
  <text x="344" y="766" font-size="11" fill="#8a7a6d">a pessoa VÊ — é onde ela trabalha</text>
  <text x="344" y="790" font-size="11.5" fill="#3b2a20">Fila à esquerda, mensagem e</text>
  <text x="344" y="808" font-size="11.5" fill="#3b2a20">resposta à direita.</text>
  <text x="344" y="828" font-size="11.5" font-weight="700" fill="#2f6b2f">[Aprovar] [Ajustar] [Não enviar]</text>
  <text x="344" y="852" font-size="11" fill="#3b2a20">o texto pode ser editado antes</text>
  <text x="344" y="870" font-size="11" fill="#8a7a6d">a construir (Sprints C e D)</text>

  <rect x="608" y="724" width="260" height="170" rx="9" fill="#fff" stroke="#9bbf9b" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="622" y="748" font-size="12.5" font-weight="700" fill="#3b2a20">Página 3 · Acompanhamento</text>
  <text x="622" y="766" font-size="11" fill="#8a7a6d">a pessoa VÊ — de volta ao papel</text>
  <text x="622" y="784" font-size="11" fill="#8a7a6d">de cliente</text>
  <text x="622" y="808" font-size="11.5" fill="#3b2a20">Mostra a resposta depois que</text>
  <text x="622" y="826" font-size="11.5" fill="#3b2a20">um humano aprovou — é o que</text>
  <text x="622" y="844" font-size="11.5" fill="#3b2a20">fecha o ciclo do visitante.</text>
  <text x="622" y="870" font-size="11" fill="#8a7a6d">a construir (Sprint E)</text>

  <rect x="886" y="724" width="260" height="170" rx="9" fill="#fff" stroke="#8a7a6d" stroke-width="1.8"/>
  <text x="900" y="748" font-size="12.5" font-weight="700" fill="#3b2a20">Servidor da tela (BFF)</text>
  <text x="900" y="766" font-size="11" fill="#8a7a6d">ninguém vê — não é página</text>
  <text x="900" y="790" font-size="11.5" fill="#3b2a20">Guarda o endereço de retomada</text>
  <text x="900" y="808" font-size="11.5" fill="#3b2a20">e é o único que o chama. O</text>
  <text x="900" y="826" font-size="11.5" fill="#3b2a20">navegador só manda o número.</text>
  <text x="900" y="852" font-size="11" font-weight="700" fill="#2f6b2f">✓ lê a fila</text>
  <text x="900" y="870" font-size="11" fill="#8a7a6d">🔒 decidir pelo clique: a construir</text>

  <line x1="315" y1="800" x2="327" y2="800" stroke="#4a8f4a" stroke-width="2" marker-end="url(#sv)"/>
  <line x1="593" y1="800" x2="605" y2="800" stroke="#4a8f4a" stroke-width="2" marker-end="url(#sv)"/>
  <line x1="871" y1="800" x2="883" y2="800" stroke="#4a8f4a" stroke-width="2" marker-end="url(#sv)"/>

  <!-- ========== RODAPÉ ========== -->
  <rect x="52" y="930" width="1094" height="70" rx="8" fill="#faf3ec" stroke="#b0764f" stroke-width="1.5"/>
  <text x="68" y="952" font-size="12" font-weight="700" fill="#6b3f27">Analogia do porteiro:</text>
  <text x="188" y="952" font-size="12" fill="#3b2a20">a atendente diz ao porteiro “libera a carga 42”. O porteiro é quem tem a chave do portão —</text>
  <text x="68" y="972" font-size="12" fill="#3b2a20">ela nunca recebe a chave na mão. Se a chave circulasse pelo navegador, quem a copiasse liberaria carga sozinho.</text>
  <text x="68" y="990" font-size="11" fill="#8a7a6d">O servidor não é burocracia: é a única peça que impede aprovação forjada.</text>

  <text x="40" y="1032" font-size="11.5" fill="#8a7a6d">Resumo: 1 pasta do demo · 1 fluxo com 2 raias (uma trabalha, uma confere) · 3 páginas · 1 servidor · 1 tabela de 19 colunas.</text>
</svg>
