<!-- Purpose: diagrama logico do agente conversacional + RAG do Demo 2 (Sprint 2 alvo) e sua relacao com o motor (Fluxo A). Padrao docs/references/padrao-diagramas-visuais.md -->
<svg viewBox="0 0 1080 720" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, system-ui, sans-serif">
  <rect x="0" y="0" width="1080" height="720" fill="#fbf7f1"/>
  <text x="30" y="40" font-size="19" font-weight="700" fill="#3b2a20">Demo 2 · Agente conversacional + RAG — lógica</text>
  <text x="30" y="60" font-size="12" fill="#8a7a6d">workflow conversacional (novo) · ✓ = provado (Sprint 1) · tracejado = a construir (Sprint 2)</text>

  <!-- Lane A cliente -->
  <rect x="30" y="80" width="230" height="300" rx="12" fill="#faf3ec" stroke="#6b3f27" stroke-width="1.5"/>
  <text x="46" y="104" font-size="13" font-weight="700" fill="#6b3f27">💬 Cliente (UI)</text>
  <rect x="48" y="120" width="194" height="70" rx="8" fill="#faf3ec" stroke="#b0764f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="60" y="143" font-size="12" font-weight="700" fill="#6b3f27">＋ Widget de chat</text>
  <text x="60" y="161" font-size="10.5" fill="#8a7a6d">no HTML já pronto</text>
  <text x="60" y="177" font-size="10.5" fill="#8a7a6d">conversa em texto</text>

  <!-- Lane B cerebro -->
  <rect x="290" y="80" width="330" height="480" rx="12" fill="#f3eef7" stroke="#7a5a9f" stroke-width="1.5"/>
  <text x="306" y="104" font-size="13" font-weight="700" fill="#5a3f7a">🧠 Cérebro — Tools Agent</text>

  <rect x="308" y="120" width="294" height="56" rx="8" fill="#faf3ec" stroke="#b0764f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="320" y="142" font-size="12" font-weight="700" fill="#6b3f27">＋ Chat Webhook</text>
  <text x="320" y="160" font-size="10.5" fill="#8a7a6d">recebe cada mensagem + session id</text>

  <rect x="308" y="192" width="294" height="92" rx="8" fill="#faf3ec" stroke="#7a5a9f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="320" y="214" font-size="12" font-weight="700" fill="#5a3f7a">＋ Tools Agent (decide o quê fazer)</text>
  <text x="320" y="233" font-size="10.5" fill="#8a7a6d">responde dúvida OU coleta dados do pedido</text>
  <text x="320" y="249" font-size="10.5" fill="#8a7a6d">porta: campos obrigatórios completos?</text>
  <text x="320" y="266" font-size="10.5" fill="#5a3f7a">só então chama "Registrar pedido"</text>

  <rect x="308" y="300" width="140" height="66" rx="8" fill="#faf3ec" stroke="#7a5a9f" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="320" y="322" font-size="11.5" font-weight="700" fill="#5a3f7a">＋ Chat Model</text>
  <text x="320" y="339" font-size="10" fill="#8a7a6d">Groq/OpenAI</text>
  <text x="320" y="354" font-size="10" fill="#8a7a6d">o "raciocínio"</text>

  <rect x="462" y="300" width="140" height="66" rx="8" fill="#faf3ec" stroke="#7a5a9f" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="474" y="322" font-size="11.5" font-weight="700" fill="#5a3f7a">＋ Chat Memory</text>
  <text x="474" y="339" font-size="10" fill="#8a7a6d">Postgres, por</text>
  <text x="474" y="354" font-size="10" fill="#8a7a6d">session id (lembra)</text>

  <!-- Lane C ferramentas -->
  <rect x="650" y="80" width="400" height="480" rx="12" fill="#eef7ee" stroke="#4a8f4a" stroke-width="1.5"/>
  <text x="666" y="104" font-size="13" font-weight="700" fill="#2f6b2f">🧰 Ferramentas do agente</text>

  <rect x="668" y="120" width="366" height="86" rx="8" fill="#fff" stroke="#4a8f4a" stroke-width="1.8"/>
  <text x="680" y="142" font-size="12" font-weight="700" fill="#3b2a20">✓ Tool 1 · FAQ / cardápio (RAG)</text>
  <text x="680" y="161" font-size="10.5" fill="#8a7a6d">busca no demo2_kb (PGVector, top-3)</text>
  <text x="680" y="177" font-size="10.5" fill="#8a7a6d">responde prazo, entrega, pagamento…</text>
  <text x="680" y="194" font-size="10" fill="#2f6b2f">provado Sprint 1 (scores 0.37–0.48)</text>

  <rect x="668" y="222" width="366" height="92" rx="8" fill="#faf3ec" stroke="#b0764f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="680" y="244" font-size="12" font-weight="700" fill="#6b3f27">＋ Tool 2 · Registrar pedido (HTTP)</text>
  <text x="680" y="263" font-size="10.5" fill="#8a7a6d">chama o motor Fluxo A pelo webhook existente</text>
  <text x="680" y="279" font-size="10.5" fill="#8a7a6d">envia os campos coletados na conversa</text>
  <text x="680" y="296" font-size="10" fill="#b0764f">reusa 100% — motor fica intocado</text>

  <!-- Fluxo A reused -->
  <rect x="668" y="336" width="366" height="200" rx="10" fill="#fff" stroke="#c9a24b" stroke-width="1.8"/>
  <text x="684" y="360" font-size="12.5" font-weight="700" fill="#8a6a1f">✓ Fluxo A · motor (workflow separado, ATIVO)</text>
  <text x="684" y="382" font-size="10.5" fill="#8a7a6d">Normalize → Qualify (IA) → Guard → Save Neon</text>
  <text x="684" y="400" font-size="10.5" fill="#8a7a6d">→ Respond → Route hot/rest</text>
  <text x="684" y="424" font-size="11" font-weight="700" fill="#2f6b2f">Hot → Telegram individual imediato</text>
  <text x="684" y="442" font-size="11" font-weight="700" fill="#5a3f7a">Morno/frio → digest 30 min (Fluxo B)</text>
  <line x1="684" y1="456" x2="1018" y2="456" stroke="#ece0d2" stroke-width="1"/>
  <text x="684" y="478" font-size="10.5" fill="#8a7a6d">Já provado ao vivo (exec 3669 + digest id=2).</text>
  <text x="684" y="496" font-size="10.5" fill="#8a7a6d">O agente NÃO reconstrói nada disso — só aciona.</text>
  <text x="684" y="520" font-size="10" fill="#8a6a1f">Mesma instância n8n · chamada local</text>

  <!-- arrows -->
  <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6b3f27"/></marker></defs>
  <g stroke="#6b3f27" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <line x1="242" y1="155" x2="306" y2="148"/>
    <line x1="455" y1="176" x2="455" y2="190"/>
    <line x1="378" y1="300" x2="378" y2="286"/>
    <line x1="532" y1="300" x2="532" y2="286"/>
  </g>
  <g stroke="#4a8f4a" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <path d="M602 224 C 635 224, 640 160, 666 160"/>
    <path d="M602 250 C 635 250, 640 262, 666 262"/>
  </g>
  <g stroke="#c9a24b" stroke-width="1.6" fill="none" marker-end="url(#ar)"><line x1="851" y1="314" x2="851" y2="334"/></g>

  <text x="30" y="600" font-size="12" font-weight="700" fill="#6b3f27">Recomendação (workflow separado, NÃO dentro do Fluxo A):</text>
  <text x="30" y="620" font-size="11" fill="#3b2a20">Fluxo A está ATIVO e provado; mexer nele arrisca a produção. Agente = workflow próprio que só ACIONA o motor por HTTP.</text>
  <text x="30" y="638" font-size="11" fill="#3b2a20">Duas portas de entrada (formulário vs conversa) com ciclos e testes independentes — padrão de mercado para agente + tools.</text>

  <text x="30" y="676" font-size="11.5" fill="#8a7a6d">Analogia: o motor (Fluxo A) é a cozinha que já funciona. O agente é o atendente novo no balcão: tira dúvidas (FAQ),</text>
  <text x="30" y="692" font-size="11.5" fill="#8a7a6d">anota o pedido conversando e, quando está completo, passa a comanda para a MESMA cozinha — sem reformar a cozinha.</text>
</svg>
