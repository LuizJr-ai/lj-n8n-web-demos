<!-- Purpose: referencia visual (placeholder) da galeria por tema do Demo 2, para orientar o Lovable no estilo/mood. Ilustracoes vetoriais proprias (sem IP de terceiros). Substituir pelas FOTOS REAIS da Alanna quando ela exportar. Sessao 07. -->
