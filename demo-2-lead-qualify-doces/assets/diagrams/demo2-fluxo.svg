<!-- Purpose: diagrama duravel do Demo 2 (sessao 07). Qualificacao de lead de encomenda (doces). Form -> webhook -> normaliza -> IA pontua -> Code blinda -> Neon grava -> IF roteia quente vs resto -> notifica dona / responde cardapio. Fonte de verdade visual antes do build. Estilo espelha demo1-fluxo.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="980" height="760" fill="#0f172a"/>
  <text x="490" y="34" fill="#e2e8f0" font-size="22" font-weight="700" text-anchor="middle">Demo 2 · Qualificação de lead de encomenda (doces artesanais)</text>
  <text x="490" y="56" fill="#94a3b8" font-size="13" text-anchor="middle">Um webhook; a IA dá nota ao pedido e o IF separa o cliente quente do curioso. Negócio-modelo: Alanna Doces.</text>

  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- APP (front) com 2 areas -->
  <rect x="40" y="90" width="330" height="370" rx="14" fill="#0c2a45" stroke="#38bdf8" stroke-width="2"/>
  <text x="58" y="114" fill="#7dd3fc" font-size="13" font-weight="700">🖥️ APP (front) — 2 telas</text>

  <rect x="58" y="126" width="294" height="150" rx="10" fill="#0f3556" stroke="#38bdf8" stroke-width="1"/>
  <text x="72" y="147" fill="#e2e8f0" font-size="13" font-weight="600">A) Página de venda (cliente)</text>
  <text x="72" y="166" fill="#94a3b8" font-size="11">link único (Insta/WhatsApp/site) → página</text>
  <text x="72" y="183" fill="#94a3b8" font-size="11">galeria por tema (chamariz) · prova social</text>
  <text x="72" y="200" fill="#94a3b8" font-size="11">💬 FAQ (sem cadastro) resolve o curioso</text>
  <text x="72" y="217" fill="#94a3b8" font-size="11">🧁 assistente coleta o pedido conversando</text>
  <text x="72" y="240" fill="#7dd3fc" font-size="11">só o orçamento vira POST (JSON)</text>
  <text x="72" y="261" fill="#7dd3fc" font-size="11">recebe: "recebido" + tier / resposta FAQ</text>

  <rect x="58" y="284" width="294" height="164" rx="10" fill="#0f3556" stroke="#38bdf8" stroke-width="1"/>
  <text x="72" y="305" fill="#e2e8f0" font-size="13" font-weight="600">B) Painel da dona (leads pontuados)</text>
  <text x="72" y="325" fill="#94a3b8" font-size="11">lista de pedidos ordenada por nota</text>
  <rect x="72" y="334" width="266" height="30" rx="6" fill="#3a1620" stroke="#f87171" stroke-width="1"/>
  <text x="82" y="353" fill="#fecaca" font-size="11">🔴 Maria · 100un Mickey · 20/12 · 92 hot</text>
  <rect x="72" y="368" width="266" height="30" rx="6" fill="#3a2f10" stroke="#f59e0b" stroke-width="1"/>
  <text x="82" y="387" fill="#fde68a" font-size="11">🟠 Ana · 50un batizado · s/ data · 61 warm</text>
  <rect x="72" y="402" width="266" height="30" rx="6" fill="#0f3556" stroke="#38bdf8" stroke-width="1"/>
  <text x="82" y="421" fill="#bae6fd" font-size="11">🔵 João · "quanto custa?" · 18 cold</text>
  <text x="72" y="443" fill="#7dd3fc" font-size="11">cada card abre um resumo pronto p/ fechar</text>

  <line x1="370" y1="200" x2="440" y2="200" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arw)"/>
  <text x="374" y="190" fill="#7dd3fc" font-size="11">POST orçamento</text>

  <!-- n8n -->
  <rect x="440" y="82" width="500" height="560" rx="14" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="458" y="106" fill="#64748b" font-size="13" font-weight="700">n8n (o cérebro)</text>

  <rect x="560" y="118" width="260" height="44" rx="10" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="578" y="138" fill="#e2e8f0" font-size="14" font-weight="600">1 · Webhook</text>
  <text x="578" y="155" fill="#94a3b8" font-size="11">recebe o formulário de orçamento</text>
  <line x1="690" y1="162" x2="690" y2="178" stroke="#64748b" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="560" y="180" width="260" height="44" rx="10" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="578" y="200" fill="#e2e8f0" font-size="14" font-weight="600">2 · Normalizar campos (Set)</text>
  <text x="578" y="217" fill="#94a3b8" font-size="11">form cru → contrato limpo</text>
  <line x1="690" y1="224" x2="690" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="560" y="242" width="260" height="48" rx="10" fill="#173a2e" stroke="#10b981" stroke-width="1.5"/>
  <text x="578" y="263" fill="#e2e8f0" font-size="14" font-weight="600">3 · Qualificar lead (IA)</text>
  <text x="578" y="281" fill="#94a3b8" font-size="11">nota 0–100 + tier + justificativa</text>
  <line x1="690" y1="290" x2="690" y2="306" stroke="#64748b" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="560" y="308" width="260" height="48" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="578" y="329" fill="#e2e8f0" font-size="14" font-weight="600">4 · Validar &amp; blindar (Code)</text>
  <text x="578" y="347" fill="#94a3b8" font-size="11">score/tier válido? senão → review</text>
  <line x1="690" y1="356" x2="690" y2="372" stroke="#64748b" stroke-width="2" marker-end="url(#arw)"/>

  <rect x="560" y="374" width="260" height="48" rx="10" fill="#2e2440" stroke="#a855f7" stroke-width="1.5"/>
  <text x="578" y="395" fill="#e2e8f0" font-size="14" font-weight="600">5 · Postgres (Neon) → id</text>
  <text x="578" y="413" fill="#94a3b8" font-size="11">grava o lead ANTES de rotear (R9)</text>
  <line x1="690" y1="422" x2="690" y2="438" stroke="#64748b" stroke-width="2" marker-end="url(#arw)"/>

  <!-- ROTEAR (IF) -->
  <rect x="560" y="440" width="260" height="46" rx="10" fill="#3a2f10" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="578" y="461" fill="#fde68a" font-size="14" font-weight="600">6 · Rotear: quente vs resto (IF)</text>
  <text x="578" y="478" fill="#fbbf24" font-size="11">hot ↓esq · warm/cold ↓dir</text>

  <!-- branch left: hot -->
  <line x1="610" y1="486" x2="610" y2="510" stroke="#64748b" stroke-width="2" marker-end="url(#arw)"/>
  <text x="560" y="502" fill="#f87171" font-size="10">hot</text>
  <rect x="472" y="512" width="200" height="52" rx="10" fill="#173a2e" stroke="#10b981" stroke-width="1.5"/>
  <text x="488" y="533" fill="#e2e8f0" font-size="13" font-weight="600">7a · Notifica a dona</text>
  <text x="488" y="550" fill="#94a3b8" font-size="11">Telegram (demo) · resumo pronto</text>
  <text x="488" y="562" fill="#94a3b8" font-size="10">→ WhatsApp em produção (swap)</text>

  <!-- branch right: rest -->
  <line x1="770" y1="486" x2="770" y2="510" stroke="#64748b" stroke-width="2" marker-end="url(#arw)"/>
  <text x="778" y="502" fill="#38bdf8" font-size="10">warm/cold</text>
  <rect x="712" y="512" width="200" height="52" rx="10" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="728" y="533" fill="#e2e8f0" font-size="13" font-weight="600">7b · Resposta automática</text>
  <text x="728" y="550" fill="#94a3b8" font-size="11">envia o cardápio · sem incomodar</text>

  <!-- respond -->
  <rect x="560" y="586" width="260" height="40" rx="10" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="578" y="611" fill="#e2e8f0" font-size="13" font-weight="600">8 · Respond → status + tier p/ a UI</text>
  <line x1="610" y1="564" x2="610" y2="586" stroke="#64748b" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="812" y1="564" x2="812" y2="576" stroke="#64748b" stroke-width="2"/>
  <line x1="812" y1="576" x2="822" y2="576" stroke="#64748b" stroke-width="2"/>

  <!-- returns to UI -->
  <path d="M560,606 L410,606 L410,200 L370,200" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arw)"/>
  <text x="44" y="500" fill="#38bdf8" font-size="11">cliente vê a confirmação; a dona vê o card pontuado</text>

  <!-- notas -->
  <rect x="40" y="660" width="900" height="82" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="56" y="682" fill="#cbd5e1" font-size="11">A IA pontua o pedido (não é fórmula na mão): quente = data próxima + quantidade real + tema definido; frio = só pergunta de preço.</text>
  <text x="56" y="702" fill="#94a3b8" font-size="11">Todo lead é gravado no Neon ANTES de notificar (R9): mesmo se a notificação falhar, nada se perde. O Code node blinda o score/tier (R11).</text>
  <text x="56" y="722" fill="#94a3b8" font-size="11">Nó que notifica/escreve conecta por último (R10); workflow fica inativo até 1 execução limpa. Modelo de IA e canal de aviso são trocáveis.</text>
</svg>
