<!-- Purpose: mockup duravel da UI do Demo 2 (sessao 07, rev2). TELA 1 = pagina de venda conversacional (heroi+CTA, galeria por tema, assistente/web chat com FAQ, botao fixo). TELA 2 = painel/alerta Telegram da dona com leads pontuados. Cores suaves (estilo Tars) aprovadas pelo Luiz. Fonte de verdade visual do App antes do build. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 780" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="980" height="780" fill="#0f172a"/>
  <text x="490" y="32" fill="#e2e8f0" font-size="21" font-weight="700" text-anchor="middle">Demo 2 · App — Página de venda conversacional + Painel da dona</text>
  <text x="490" y="53" fill="#94a3b8" font-size="12.5" text-anchor="middle">Link único (bio do Instagram/WhatsApp/site) leva à página. Fotos atraem · FAQ tira dúvida sem cadastro · assistente fecha.</text>

  <!-- ===== TELA 1: PÁGINA DE VENDA (cliente) ===== -->
  <text x="60" y="86" fill="#c4b5fd" font-size="13" font-weight="700">TELA 1 — Página de venda (cliente) · destino do "link na bio"</text>
  <rect x="60" y="96" width="410" height="648" rx="16" fill="#faf7ff" stroke="#c4b5fd" stroke-width="2"/>

  <!-- 1 HERO -->
  <rect x="60" y="96" width="410" height="96" rx="16" fill="#eef2ff"/>
  <rect x="60" y="150" width="410" height="42" fill="#eef2ff"/>
  <text x="82" y="132" fill="#3730a3" font-size="18" font-weight="700">🧁 Doce Aurora</text>
  <text x="82" y="156" fill="#4338ca" font-size="12">Brigadeiros e doces artesanais · sob encomenda</text>
  <rect x="82" y="166" width="180" height="34" rx="17" fill="#6d28d9"/>
  <text x="172" y="188" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Pedir orçamento →</text>

  <!-- 2 GALERIA -->
  <text x="82" y="224" fill="#4c1d95" font-size="12" font-weight="700">2 · Galeria por tema (o chamariz)</text>
  <rect x="82" y="232" width="86" height="66" rx="10" fill="#fde4ef"/>
  <text x="125" y="269" font-size="12" text-anchor="middle">🎂</text><text x="125" y="290" fill="#9d174d" font-size="9.5" text-anchor="middle">Infantil</text>
  <rect x="178" y="232" width="86" height="66" rx="10" fill="#e0f2fe"/>
  <text x="221" y="269" font-size="12" text-anchor="middle">💍</text><text x="221" y="290" fill="#075985" font-size="9.5" text-anchor="middle">Casamento</text>
  <rect x="274" y="232" width="86" height="66" rx="10" fill="#dcfce7"/>
  <text x="317" y="269" font-size="12" text-anchor="middle">🏢</text><text x="317" y="290" fill="#166534" font-size="9.5" text-anchor="middle">Corporativo</text>
  <rect x="370" y="232" width="78" height="66" rx="10" fill="#fef3c7"/>
  <text x="409" y="269" font-size="12" text-anchor="middle">🎉</text><text x="409" y="290" fill="#92400e" font-size="9.5" text-anchor="middle">Datas</text>

  <!-- 3 ASSISTENTE (web chat) -->
  <text x="82" y="326" fill="#4c1d95" font-size="12" font-weight="700">3 · Assistente (web chat)</text>
  <rect x="82" y="334" width="366" height="150" rx="12" fill="#f5f3ff" stroke="#ddd6fe"/>
  <rect x="96" y="348" width="250" height="30" rx="10" fill="#ede9fe"/>
  <text x="106" y="368" fill="#5b21b6" font-size="11">Oi! Quer tirar uma dúvida ou pedir orçamento? 😊</text>
  <rect x="200" y="384" width="248" height="26" rx="10" fill="#ddd6fe"/>
  <text x="438" y="401" fill="#4c1d95" font-size="11" text-anchor="end">Quero 100 do Mickey p/ dia 20</text>
  <rect x="96" y="416" width="200" height="30" rx="10" fill="#ede9fe"/>
  <text x="106" y="436" fill="#5b21b6" font-size="11">Perfeito! Retirada em Goiânia? 📅</text>
  <!-- 2 portas -->
  <rect x="96" y="452" width="165" height="24" rx="12" fill="#fff" stroke="#a78bfa"/>
  <text x="178" y="468" fill="#6d28d9" font-size="10.5" text-anchor="middle">💬 Dúvida rápida (FAQ)</text>
  <rect x="269" y="452" width="165" height="24" rx="12" fill="#6d28d9"/>
  <text x="351" y="468" fill="#fff" font-size="10.5" font-weight="700" text-anchor="middle">🧁 Pedir orçamento</text>

  <!-- 4 FAQ -->
  <text x="82" y="512" fill="#4c1d95" font-size="12" font-weight="700">4 · FAQ (clica e abre · sem cadastro — R12)</text>
  <rect x="82" y="520" width="366" height="22" rx="8" fill="#f1f5f9"/><text x="94" y="535" fill="#334155" font-size="10.5">▾ Prazo mínimo de encomenda? · datas especiais, +</text>
  <rect x="82" y="546" width="366" height="22" rx="8" fill="#f1f5f9"/><text x="94" y="561" fill="#334155" font-size="10.5">▸ Precisa de sinal p/ reservar a data? · 50%</text>
  <rect x="82" y="572" width="366" height="22" rx="8" fill="#f1f5f9"/><text x="94" y="587" fill="#334155" font-size="10.5">▸ Pedido mínimo? · fecha por cento/unidade</text>
  <rect x="82" y="598" width="366" height="22" rx="8" fill="#f1f5f9"/><text x="94" y="613" fill="#334155" font-size="10.5">▸ Fazem o tema que eu quiser? · envie a foto ref.</text>

  <!-- 5 PROVA -->
  <rect x="82" y="620" width="366" height="40" rx="10" fill="#eef2ff"/>
  <text x="94" y="638" fill="#3730a3" font-size="11" font-weight="700">⭐ 32,3K seguidores · sob encomenda</text>
  <text x="94" y="653" fill="#4338ca" font-size="10.5">"Ficou lindo e igual à foto!" — cliente</text>

  <!-- botao fixo -->
  <rect x="82" y="674" width="366" height="40" rx="12" fill="#6d28d9"/>
  <text x="265" y="699" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">🧁 Falar com o assistente (fixo, sempre visível)</text>
  <text x="82" y="732" fill="#94a3b8" font-size="10">📷 Instagram · 💬 WhatsApp · atende todo o Brasil</text>

  <!-- ===== TELA 2: DONA ===== -->
  <text x="520" y="86" fill="#7dd3fc" font-size="13" font-weight="700">TELA 2 — Dona: alerta Telegram (quente) + painel</text>
  <rect x="520" y="96" width="400" height="648" rx="16" fill="#0b1220" stroke="#334155" stroke-width="2"/>

  <!-- Telegram alert -->
  <rect x="540" y="116" width="360" height="104" rx="12" fill="#0e2a3a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="556" y="138" fill="#7dd3fc" font-size="12" font-weight="700">📲 Telegram — alerta de lead QUENTE</text>
  <text x="556" y="160" fill="#e2e8f0" font-size="11">🔴 Maria · 100un Mickey · 20/12 · score 92</text>
  <text x="556" y="178" fill="#cbd5e1" font-size="11">📱 (62) 9 9999-9999 · retirada</text>
  <text x="556" y="198" fill="#94a3b8" font-size="10.5">"Data e tema fechados, volume alto — priorizar</text>
  <text x="556" y="212" fill="#94a3b8" font-size="10.5">orçamento e confirmar retirada dia 20."</text>

  <text x="540" y="248" fill="#64748b" font-size="11" font-weight="700">Painel — pedidos por nota (quente no topo)</text>

  <!-- HOT -->
  <rect x="540" y="260" width="360" height="120" rx="10" fill="#1a0f14" stroke="#f87171" stroke-width="2"/>
  <text x="556" y="284" fill="#fecaca" font-size="13" font-weight="700">🔴 Maria Souza</text>
  <rect x="820" y="268" width="62" height="24" rx="12" fill="#7f1d1d"/><text x="851" y="285" fill="#fecaca" font-size="12" font-weight="700" text-anchor="middle">92 hot</text>
  <text x="556" y="305" fill="#cbd5e1" font-size="11">100 un. · Brigadeiro gourmet · Mickey/Minnie</text>
  <text x="556" y="323" fill="#cbd5e1" font-size="11">📅 20/12/2026 · retirada</text>
  <line x1="556" y1="334" x2="884" y2="334" stroke="#3f2226"/>
  <text x="556" y="353" fill="#f9a8d4" font-size="10.5" font-weight="600">Resumo pronto p/ fechar:</text>
  <text x="556" y="369" fill="#e2e8f0" font-size="10.5">Evento definido, volume alto → priorizar.</text>

  <!-- WARM -->
  <rect x="540" y="392" width="360" height="56" rx="10" fill="#1a160b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="556" y="414" fill="#fde68a" font-size="12.5" font-weight="700">🟠 Ana Lima</text>
  <rect x="820" y="401" width="62" height="22" rx="11" fill="#78350f"/><text x="851" y="417" fill="#fde68a" font-size="11" font-weight="700" text-anchor="middle">61 warm</text>
  <text x="556" y="434" fill="#cbd5e1" font-size="11">50 un. · batizado · sem data definida</text>

  <!-- COLD -->
  <rect x="540" y="460" width="360" height="56" rx="10" fill="#0b1e2e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="556" y="482" fill="#bae6fd" font-size="12.5" font-weight="700">🔵 João Pereira</text>
  <rect x="820" y="469" width="62" height="22" rx="11" fill="#0c4a6e"/><text x="851" y="485" fill="#bae6fd" font-size="11" font-weight="700" text-anchor="middle">18 cold</text>
  <text x="556" y="502" fill="#cbd5e1" font-size="11">"quanto custa?" · FAQ respondeu · recebeu cardápio</text>

  <text x="540" y="548" fill="#64748b" font-size="11">Quente vai pro Telegram na hora; frio já foi resolvido</text>
  <text x="540" y="566" fill="#64748b" font-size="11">pelo FAQ/cardápio, sem gastar tempo da dona.</text>

  <rect x="540" y="590" width="360" height="132" rx="10" fill="#111a2e" stroke="#1e293b"/>
  <text x="556" y="614" fill="#cbd5e1" font-size="11" font-weight="700">Por que isso vende</text>
  <text x="556" y="634" fill="#94a3b8" font-size="10.5">• Resposta em ≤5 min = 21× mais chance (MIT/InsideSales)</text>
  <text x="556" y="652" fill="#94a3b8" font-size="10.5">• ≤1h = ~7× (HBR, 2,24M leads)</text>
  <text x="556" y="670" fill="#94a3b8" font-size="10.5">• BR: 90,8% só atende manual → espaço aberto</text>
  <text x="556" y="694" fill="#64748b" font-size="10">Telegram no demo (grátis/instantâneo); WhatsApp em produção</text>
  <text x="556" y="710" fill="#64748b" font-size="10">= troca de 1 nó (cérebro n8n igual).</text>

  <text x="60" y="768" fill="#475569" font-size="10.5">Mockup visual (não o app final) — base do prompt do Lovable. Cores/textos ajustáveis; a lógica pontuar+rotear e o FAQ sem cadastro são fixos (SPEC R8–R12).</text>
</svg>
